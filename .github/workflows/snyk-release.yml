name: Run Snyk monitor on releases

on:
  release:
    types: [ published ]

jobs:
  run-snyk-monitor:
    runs-on: ubuntu-latest
    environment: snyk-monitor-releases

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: hivemq-prometheus-extension

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: |
            11
            25

      - name: Setup Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

      - name: Run Snyk monitor
        run: >
          snyk monitor --configuration-matching=^runtimeClasspath$ --target-reference=${{ github.ref_name }}
          --org=hivemq-releases --project-name=hivemq-prometheus-extension --remote-repo-url=hivemq-prometheus-extension
          --project-lifecycle=production -d hivemq-prometheus-extension
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
